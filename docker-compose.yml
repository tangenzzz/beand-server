# bean'd server on a Raspberry Pi 4: private Nostr relay (strfry) and private
# Blossom server. Reachable only on the LAN and the tailnet; nothing is
# forwarded on the router. Data lives under ./data (not in the repo).
#
# Images are pinned by digest, so `docker compose pull` never silently fetches
# a new version. See the README for updates.

services:
  strfry:
    # ghcr.io/hoytech/strfry:latest = strfry 1.1.3
    image: ghcr.io/hoytech/strfry@sha256:36f1886d185a88ca57c66ebe52e6e9e8428dac2486eea0a5d50ff934f18b60c3
    restart: unless-stopped
    command: ["--config=/etc/strfry.conf", "relay"]
    ports:
      - "7777:7777"
    volumes:
      - ./strfry/strfry.conf:/etc/strfry.conf:ro
      - ./strfry/write-policy.sh:/app/plugins/write-policy.sh:ro
      - ./policy:/app/policy:ro
      - ./data/strfry-db:/app/strfry-db
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  blossom:
    image: ghcr.io/hzrd149/blossom-server:6.4.1@sha256:446fa6c4b0ca529a1fbceabf5ea75839b5b76dfb0d0e1d150f3bae5f9a52b3b8
    restart: unless-stopped
    environment:
      # Refuse to start with open defaults if the config is missing.
      BLOSSOM_REQUIRE_CONFIG: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./blossom/config.yml:/app/config.yml:ro
      - ./data/blossom:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Status page: static HTML from scripts/status.sh (cron, every minute),
  # served by BusyBox httpd. Mounted read-only.
  status:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    restart: unless-stopped
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    ports:
      - "8080:8080"
    volumes:
      - ./data/status:/www:ro
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
